name: Version builds and server smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew -Pmc=${{ matrix.minecraft }} build --console plain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.minecraft, '1.') && '21' || '25' }}
      - name: Packaged dedicated server smoke
        shell: pwsh
        run: ./scripts/prepare-smoke.ps1 -Version '${{ matrix.minecraft }}' -AcceptEula
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancementsTogether-${{ matrix.minecraft }}-alpha
          path: versions/${{ matrix.minecraft }}/build/libs/AdvancementsTogether-${{ matrix.minecraft }}-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.minecraft }}
          path: |
            common/build/reports/tests/
            .tools/smoke/${{ matrix.minecraft }}/smoke.log
